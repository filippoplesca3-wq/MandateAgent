services:
  - type: web
    name: agent-mandate
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Replay needs no PayPal or Gemini credentials; the demo is read-only.
      - key: REPLAY_FILE
        value: replays/demo-run.json
      # Render generates this once and keeps it across restarts, so the
      # published Ed25519 public key is stable for the life of the service.
      - key: MANDATE_SIGNING_KEY
        generateValue: true
      # Live runs are opt-in and capped. The Gemini key is set in the Render
      # dashboard (sync: false), never in this file. Without the key the
      # endpoint stays off and the recording remains the only path.
      - key: DEMO_LIVE
        value: "1"
      - key: DEMO_LIVE_DAILY_CAP
        value: "10"
      - key: DEMO_LIVE_COOLDOWN_SECONDS
        value: "120"
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
